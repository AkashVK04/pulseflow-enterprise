version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseflow-postgres
    environment:
      POSTGRES_DB: pulseflow_db
      POSTGRES_USER: pulseflow_user
      POSTGRES_PASSWORD: pulseflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseflow_user -d pulseflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseflow-redis
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseflow-app
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulseflow_db
      SPRING_DATASOURCE_USERNAME: pulseflow_user
      SPRING_DATASOURCE_PASSWORD: pulseflow_password
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
